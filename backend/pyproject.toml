# 依赖的唯一来源。用 uv 管理：
#   uv sync              # 创建 .venv 并安装依赖 + 生成 uv.lock
#   uv add <package>     # 加依赖（自动写入这里并更新锁文件）
#   uv run pytest        # 在 .venv 里执行命令
#
# 为什么不再保留 requirements.txt：两处维护必然会出现版本不一致，
# 而 uv.lock 记录了「精确到补丁号」的版本，换机器能装出一模一样的环境。

[project]
name = "ai-research-workspace-backend"
version = "0.1.0"
description = "AI Research Workspace backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # OpenAI 兼容 SDK：换 base_url 就能切 OpenAI / DeepSeek / 通义 / Moonshot / 混元
    "openai>=1.50.0",
    # 外部调用的指数退避重试，比手写 while + sleep 可靠
    "tenacity>=9.0.0",
    "httpx>=0.28.1",
    "pypdf>=6.19.0",
    "numpy>=2.4.6",
    "python-multipart>=0.0.32",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    # FastAPI TestClient 的底层依赖
    "httpx>=0.27.0",
    "httpx2>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]

# 显式声明构建后端与包布局。
#
# 为什么必须写这一段：setuptools 在「扁平布局」下会去猜哪个顶层目录是包，
# 当存在**多个**顶层目录时（这里是 app/ 、storage/ 、frontend_dist/）它无法
# 判断，直接报错：
#     error: Multiple top-level packages discovered in a flat-layout
# 这个错误原先没暴露，是因为本地用 `uv sync`（只装依赖、不构建本项目）；
# 而托管沙箱走 `pip install .`，会触发真正的构建阶段。
#
# 处理方式：显式声明只有 app 是包，并让 setuptools 不要自动发现。
# 同时把 storage/ 与 frontend_dist/ 排除 —— 它们是**运行时数据目录**
# （SQLite 文件、前端静态产物），不是 Python 包。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 只打包 `app` —— 必须显式声明，否则 setuptools 的 flat-layout 自动发现在
# 看到 app/、storage/、frontend_dist/ 并列时会直接报错：
#   error: Multiple top-level packages discovered in a flat-layout
# （沙箱部署走 `pip install .`，这个错误会直接让部署失败。）
# `scripts/` 有意不打包：它是本地运维工具（填 Key 后重新部署用），
# 服务器上不需要它，也不该让 key 相关脚本扩散到运行环境。
packages = ["app"]

[tool.setuptools.package-data]
# 子包要一起带上（app/api、app/core 等）；不写这个只会装顶层的 app
app = ["**/*.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# 让 async def test_* 自动被当作异步测试执行（无需逐个加 @pytest.mark.asyncio）
asyncio_mode = "auto"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
